name: One-shot main split

on:
  push:
    branches:
      - refactor/slim-main-runtime-host-flow

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/slim-main-runtime-host-flow
          fetch-depth: 0

      - name: Split main runtime and host flow
        shell: python
        run: |
          from pathlib import Path

          main_path = Path("System/main.lua")
          source = main_path.read_text(encoding="utf-8")
          split_marker = "\nlocal function controllerSucceeded(label, report)"
          if source.count(split_marker) != 1:
              raise SystemExit("main split marker was not found exactly once")

          runtime_body, host_tail = source.split(split_marker, 1)
          host_body = "local function controllerSucceeded(label, report)" + host_tail

          old_revision = "runtime-bundle-9c1d7e4f3a6b2e10"
          new_revision = "runtime-bundle-main-split-v1-20260804"
          if runtime_body.count(old_revision) != 1:
              raise SystemExit("runtime revision marker was not found exactly once")
          runtime_body = runtime_body.replace(old_revision, new_revision, 1)

          runtime_source = """(function()
          """ + runtime_body.rstrip() + """

              return function(triggerId, action, ...)
                  if action == "install" then
                      return true
                  elseif action == "beginEvent" then
                      return beginRunScriptEvent(triggerId, ...)
                  elseif action == "run" then
                      return runScript(triggerId, ...)
                  elseif action == "diagnostics" then
                      return getRunScriptCacheDiagnostics()
                  elseif action == "clearCache" then
                      return clearRunScriptCache(...)
                  elseif action == "setDevelopmentMode" then
                      return setRunScriptCacheDevelopmentMode(...)
                  end
                  error("unsupported runtime action: " .. tostring(action))
              end
          end)()
          """

          opening_replacements = {
              'listenEdit("editDisplay", function(triggerId, data, meta)\n    beginRunScriptEvent(triggerId, "editDisplay")':
                  'local function handleEditDisplay(triggerId, data, meta)',
              'listenEdit("editInput", function(triggerId, data)\n    beginRunScriptEvent(triggerId, "editInput")':
                  'local function handleEditInput(triggerId, data)',
              'onButtonClick = async(function(triggerId, data)\n    beginRunScriptEvent(triggerId, "onButtonClick")':
                  'local function handleButtonClick(triggerId, data)',
              'listenEdit("editRequest", function(triggerId, data)\n    beginRunScriptEvent(triggerId, "editRequest")':
                  'local function handleEditRequest(triggerId, data)',
              'onStart = async(function(triggerId)\n    beginRunScriptEvent(triggerId, "onStart")':
                  'local function handleStart(triggerId)',
              'onOutput = async(function(triggerId)\n    beginRunScriptEvent(triggerId, "onOutput")':
                  'local function handleOutput(triggerId)',
          }
          for old, new in opening_replacements.items():
              if host_body.count(old) != 1:
                  raise SystemExit(f"host handler opening was not found exactly once: {old[:50]}")
              host_body = host_body.replace(old, new, 1)

          closing_replacements = [
              ('end)\n\n--전투 중 입력은 filler로 정규화하되, 조기 승리 뒤 자유행동은 원문을 보존',
               'end\n\n--전투 중 입력은 filler로 정규화하되, 조기 승리 뒤 자유행동은 원문을 보존'),
              ('end)\n\n--버튼 클릭시 동작', 'end\n\n--버튼 클릭시 동작'),
              ('end)\n\n--정상 요청에 저장된 비공개 턴 사건과 사용자 장면 지시를 request에만 추가',
               'end\n\n--정상 요청에 저장된 비공개 턴 사건과 사용자 장면 지시를 request에만 추가'),
              ('end)\n\n--수동 전송의 턴 준비·실패 복구·commit-only 복구',
               'end\n\n--수동 전송의 턴 준비·실패 복구·commit-only 복구'),
              ('end)\n\n--완성 응답을 관측한 뒤 턴을 한 번만 확정',
               'end\n\n--완성 응답을 관측한 뒤 턴을 한 번만 확정'),
              ('end)\n\n--[[\n게임 시작시 필요한 db를 챗변수로 저장하는 프로세스 필요\n    퍼메를 세팅용으로 구성하고 세팅이 완료되기 전에는 onStart에서 return false로 채팅 보내는것을 막을 것.\n]]',
               'end'),
          ]
          for old, new in closing_replacements:
              if host_body.count(old) != 1:
                  raise SystemExit(f"host handler closing was not found exactly once: {old[:50]}")
              host_body = host_body.replace(old, new, 1)

          host_source = """(function()
          """ + host_body.rstrip() + """

              return function(triggerId, action, ...)
                  if action == "editDisplay" then
                      return handleEditDisplay(triggerId, ...)
                  elseif action == "editInput" then
                      return handleEditInput(triggerId, ...)
                  elseif action == "buttonClick" then
                      return handleButtonClick(triggerId, ...)
                  elseif action == "editRequest" then
                      return handleEditRequest(triggerId, ...)
                  elseif action == "start" then
                      return handleStart(triggerId, ...)
                  elseif action == "output" then
                      return handleOutput(triggerId, ...)
                  end
                  error("unsupported hostFlow action: " .. tostring(action))
              end
          end)()
          """

          slim_main = r'''-- RisuAI host entrypoint. Runtime and host orchestration are loaded lazily
          -- because lore access requires the current event triggerId.
          local runtimeHandler = nil
          local hostFlowHandler = nil

          local function loadBootstrapLore(triggerId, moduleName)
              local loreName = moduleName .. ".lua"
              local matches = getLoreBooks(triggerId, loreName)
              if type(matches) ~= "table" then
                  error("bootstrap lore lookup failed: " .. loreName)
              end

              local source = nil
              local sourceCount = 0
              for _, entry in ipairs(matches) do
                  local content = type(entry) == "table" and entry.content or nil
                  if type(content) == "string" and content ~= "" then
                      sourceCount = sourceCount + 1
                      source = content
                  end
              end
              if source == nil then
                  error("bootstrap lore not found: " .. loreName)
              end
              if sourceCount > 1 and type(print) == "function" then
                  print("bootstrap warning: duplicate lorebook '" .. loreName
                      .. "'; using the last match.")
              end

              local chunk, compileError = load(
                  "return" .. source,
                  "bootstrap_lore:" .. moduleName,
                  "t",
                  _G
              )
              if not chunk then
                  error("bootstrap compile failed for " .. moduleName
                      .. ": " .. tostring(compileError))
              end

              local loaded, handler = pcall(chunk)
              if not loaded then
                  error("bootstrap load failed for " .. moduleName
                      .. ": " .. tostring(handler))
              end
              if type(handler) ~= "function" then
                  error("bootstrap lore did not return a handler: " .. moduleName)
              end
              return handler
          end

          local function ensureBootstrap(triggerId)
              if runtimeHandler ~= nil and hostFlowHandler ~= nil then
                  return
              end

              runtimeHandler = loadBootstrapLore(triggerId, "runtime")
              local installed, result = pcall(runtimeHandler, triggerId, "install")
              if not installed or result ~= true then
                  runtimeHandler = nil
                  error("runtime bootstrap failed: " .. tostring(result))
              end

              local loaded, handler = pcall(loadBootstrapLore, triggerId, "hostFlow")
              if not loaded then
                  runtimeHandler = nil
                  error(tostring(handler))
              end
              hostFlowHandler = handler
          end

          local function dispatch(triggerId, mode, action, ...)
              ensureBootstrap(triggerId)
              runtimeHandler(triggerId, "beginEvent", mode)
              return hostFlowHandler(triggerId, action, ...)
          end

          listenEdit("editDisplay", function(triggerId, data, meta)
              return dispatch(triggerId, "editDisplay", "editDisplay", data, meta)
          end)

          listenEdit("editInput", function(triggerId, data)
              return dispatch(triggerId, "editInput", "editInput", data)
          end)

          onButtonClick = async(function(triggerId, data)
              return dispatch(triggerId, "onButtonClick", "buttonClick", data)
          end)

          listenEdit("editRequest", function(triggerId, data)
              return dispatch(triggerId, "editRequest", "editRequest", data)
          end)

          onStart = async(function(triggerId)
              return dispatch(triggerId, "onStart", "start")
          end)

          onOutput = async(function(triggerId)
              return dispatch(triggerId, "onOutput", "output")
          end)
          '''
          slim_main = "\n".join(line[10:] if line.startswith("          ") else line for line in slim_main.splitlines()) + "\n"

          Path("System/runtime.lua").write_text(runtime_source, encoding="utf-8")
          Path("System/hostFlow.lua").write_text(host_source, encoding="utf-8")
          main_path.write_text(slim_main, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              "`System/main.lua`는 RisuAI 이벤트와 게임 런타임을 연결하는 메인 스크립트입니다. 로어 조회, 모듈 캐시, UI anchor, 게임 시작, 캐릭터 접근 장면 생성, 전투 요청 및 출력 처리의 호스트 측 진입점을 담당합니다.",
              "`System/main.lua`는 RisuAI 이벤트를 등록하고 첫 이벤트에서 런타임을 bootstrap하는 얇은 진입점입니다. `System/runtime.lua`는 로어 조회·컴파일·캐시를, `System/hostFlow.lua`는 UI anchor·캐릭터 접근 장면·버튼 및 생성 훅 연결을 담당합니다."
          )
          readme = readme.replace(
              "        System/main.lua\n  호스트 API · 로어 로딩 · 캐시 · UI anchor",
              "        System/main.lua\n       이벤트 등록 · bootstrap\n                │\n                ▼\n System/runtime.lua · System/hostFlow.lua\n 로어 실행·캐시 · UI anchor · 호스트 흐름"
          )
          readme = readme.replace(
              "| `System/main.lua` | RisuAI 호스트 이벤트, 로어 모듈 로더, 캐시, UI anchor, LLM 호출 연결 |",
              "| `System/main.lua` | RisuAI 이벤트 등록과 지연 bootstrap |\n| `System/runtime.lua` | 로어 조회·컴파일, 이벤트/웜 캐시와 진단 |\n| `System/hostFlow.lua` | UI anchor, 접근 장면, 버튼과 생성 훅 연결 |"
          )
          readme_path.write_text(readme, encoding="utf-8")

          if len(slim_main.splitlines()) > 120:
              raise SystemExit("slim main exceeded 120 lines")
          forbidden = ["LLM", "RUNTIME_BUNDLE_REVISION", "APPROACH_PROCESSING_MARKUP", "UI_ANCHOR_MARKER"]
          for token in forbidden:
              if token in slim_main:
                  raise SystemExit(f"main still owns extracted responsibility: {token}")
          for required in ["RUN_SCRIPT_SOURCE_CACHE_MAX_ENTRIES", "function runScript", "function beginRunScriptEvent"]:
              if required not in runtime_source:
                  raise SystemExit(f"runtime extraction missing: {required}")
          for required in ["APPROACH_PROCESSING_MARKUP", "generateApproachScene", "handleButtonClick", "refreshGameUi"]:
              if required not in host_source:
                  raise SystemExit(f"host flow extraction missing: {required}")

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Validate Lua syntax and bootstrap
        run: |
          luac5.4 -p System/main.lua
          luac5.4 -p System/runtime.lua
          luac5.4 -p System/hostFlow.lua
          cat > /tmp/main_split_smoke.lua <<'LUA'
          local function readFile(path)
              local file = assert(io.open(path, "rb"))
              local content = file:read("*a")
              file:close()
              return content
          end

          local hooks = {}
          local lores = {
              ["runtime.lua"] = readFile("System/runtime.lua"),
              ["hostFlow.lua"] = readFile("System/hostFlow.lua"),
          }

          function getLoreBooks(_, name)
              local content = lores[name]
              if content == nil then return {} end
              return { { content = content } }
          end
          function getChatVar() return "" end
          function setChatVar() end
          function getName() return "Smoke Character" end
          function getCharacterFirstMessage() return "Smoke First Message" end
          function listenEdit(name, callback) hooks[name] = callback end
          function async(callback) return callback end
          function reloadDisplay() end
          function print() end
          json = {
              encode = function(value) return tostring(value) end,
              decode = function() return {} end,
          }

          assert(load(readFile("System/main.lua"), "@System/main.lua", "t", _G))()
          assert(type(hooks.editDisplay) == "function")
          assert(type(hooks.editInput) == "function")
          assert(type(hooks.editRequest) == "function")
          assert(type(onButtonClick) == "function")
          assert(type(onStart) == "function")
          assert(type(onOutput) == "function")
          assert(hooks.editDisplay("smoke-trigger", "plain text", { index = 0 }) == "plain text")
          assert(type(runScript) == "function")
          assert(type(beginRunScriptEvent) == "function")
          assert(type(refreshGameUi) == "function")
          assert(type(ensureGameUiAnchor) == "function")
          LUA
          lua5.4 /tmp/main_split_smoke.lua

      - name: Commit refactor
        run: |
          rm .github/workflows/refactor-main-split.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: split runtime and host flow from main"
          git push origin HEAD:refactor/slim-main-runtime-host-flow
