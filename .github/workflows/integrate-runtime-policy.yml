name: Integrate runtime policy

on:
  push:
    branches:
      - fix/preserve-ui-anchor-on-output-failure

permissions:
  contents: write

jobs:
  integrate-test-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-ui-anchor-on-output-failure
          fetch-depth: 0

      - name: Integrate policy into runtime
        shell: python
        run: |
          from pathlib import Path

          runtime_path = Path("System/runtime.lua")
          runtime = runtime_path.read_text(encoding="utf-8")

          policy_block = r'''
local turnInitializationDepth = 0

local function policyIsFinite(value)
    return type(value) == "number"
        and value == value
        and value ~= math.huge
        and value ~= -math.huge
end

local function policyIsInteger(value, minimum)
    return policyIsFinite(value)
        and value % 1 == 0
        and (minimum == nil or value >= minimum)
end

local function copyPolicyTable(value)
    local copy = {}
    for key, item in pairs(value) do
        copy[key] = item
    end
    return copy
end

-- 완료 이력은 직전 턴의 finish를 기록한다. 다음 턴 초기화 중에는
-- turn_start 효과가 현재 은폐·저항·무드를 합법적으로 바꿀 수 있으므로,
-- battleHistory의 연속성 비교에만 직전 finish를 투영한다. 실제 state는
-- 바꾸지 않으며 stateSchema의 나머지 검증은 원본 state를 계속 검사한다.
local function projectHistoryValidationState(history, state)
    if type(history) ~= "table"
        or type(history.turns) ~= "table"
        or type(state) ~= "table"
        or state.status ~= "active"
        or not policyIsInteger(state.turnNumber, 1) then
        return state, false
    end

    local turnCount = #history.turns
    if turnCount == 0 or state.turnNumber ~= turnCount + 1 then
        return state, false
    end

    local last = history.turns[turnCount]
    local finish = type(last) == "table" and last.finish or nil
    if type(finish) ~= "table"
        or state.lastCommittedTurnId ~= last.turnId
        or not policyIsFinite(finish.stealth)
        or not policyIsFinite(finish.resistance)
        or type(finish.mood) ~= "string"
        or finish.status ~= "active"
        or type(state.player) ~= "table"
        or type(state.character) ~= "table" then
        return state, false
    end

    local receipt = state.turnStartReceipt
    if receipt ~= nil then
        local baseline = type(receipt) == "table" and receipt.baseline or nil
        if type(baseline) ~= "table"
            or baseline.stealth ~= finish.stealth
            or baseline.resistance ~= finish.resistance
            or baseline.mood ~= finish.mood then
            return state, false
        end
    end

    local projected = copyPolicyTable(state)
    projected.player = copyPolicyTable(state.player)
    projected.character = copyPolicyTable(state.character)
    projected.player.stealth = finish.stealth
    projected.character.resistance = finish.resistance
    projected.character.mood = finish.mood
    return projected, true
end
'''

          marker = "\n--로어북에서 스크립트를 호출해 실행\n"
          if runtime.count(marker) != 1:
              raise SystemExit("runtime policy insertion marker not found exactly once")
          runtime = runtime.replace(marker, "\n" + policy_block + marker, 1)

          wrapper = r'''
local function invokeRunScriptWithPolicy(handler, triggerId, script, ...)
    local arguments = table.pack(...)
    local action = arguments[1]
    local isTurnInitialization = script == "turnInitializer"
        and action == "prepareTurn"

    if isTurnInitialization then
        turnInitializationDepth = turnInitializationDepth + 1
    end

    local packed = table.pack(pcall(function()
        if turnInitializationDepth > 0
            and script == "battleHistory"
            and action == "validate" then
            local projected, applied = projectHistoryValidationState(
                arguments[2],
                arguments[3]
            )
            if applied then
                arguments[3] = projected
            end
        end
        return invokeRunScriptHandler(
            handler,
            triggerId,
            table.unpack(arguments, 1, arguments.n)
        )
    end))

    if isTurnInitialization then
        turnInitializationDepth = turnInitializationDepth - 1
    end

    if not packed[1] then
        debug(1, "runtime policy execution error: " .. tostring(packed[2]))
        return nil
    end
    return table.unpack(packed, 2, packed.n)
end

'''
          function_marker = "function runScript(triggerId, script, ...)\n"
          if runtime.count(function_marker) != 1:
              raise SystemExit("runScript marker not found exactly once")
          runtime = runtime.replace(function_marker, wrapper + function_marker, 1)

          old_call = "return invokeRunScriptHandler(transactionHandler, triggerId, ...)"
          new_call = "return invokeRunScriptWithPolicy(transactionHandler, triggerId, script, ...)"
          if runtime.count(old_call) != 1:
              raise SystemExit("transaction invoke site not found exactly once")
          runtime = runtime.replace(old_call, new_call, 1)

          old_call = "return invokeRunScriptHandler(handler, triggerId, ...)"
          new_call = "return invokeRunScriptWithPolicy(handler, triggerId, script, ...)"
          if runtime.count(old_call) != 1:
              raise SystemExit("final invoke site not found exactly once")
          runtime = runtime.replace(old_call, new_call, 1)

          diagnostics_marker = "        currentMode = currentRuntimeMode,\n"
          if runtime.count(diagnostics_marker) != 1:
              raise SystemExit("runtime diagnostics marker not found exactly once")
          runtime = runtime.replace(
              diagnostics_marker,
              diagnostics_marker + "        turnInitializationDepth = turnInitializationDepth,\n",
              1,
          )
          runtime_path.write_text(runtime, encoding="utf-8")

          main_path = Path("System/main.lua")
          main = main_path.read_text(encoding="utf-8")
          main = main.replace(
              'RUNTIME_BUNDLE_REVISION = "runtime-bundle-turn-start-history-policy-v1-20260805"',
              'RUNTIME_BUNDLE_REVISION = "runtime-bundle-turn-start-history-integrated-v1-20260805"',
              1,
          )
          if main.count("local runtimePolicyHandler = nil\n") != 1:
              raise SystemExit("runtimePolicyHandler declaration not found")
          main = main.replace("local runtimePolicyHandler = nil\n", "", 1)
          policy_bootstrap = '''    if runtimePolicyHandler == nil then
              runtimePolicyHandler = installBootstrapHandler(triggerId, "runtimePolicy")
          end

          '''
          if main.count(policy_bootstrap) != 1:
              raise SystemExit("runtimePolicy bootstrap block not found")
          main = main.replace(policy_bootstrap, "", 1)
          if "runtimePolicy" in main:
              raise SystemExit("main.lua still references runtimePolicy")
          main_path.write_text(main, encoding="utf-8")

          Path("Tests/runtime-policy-check.lua").write_text(r'''local function readFile(path)
              local file = assert(io.open(path, "rb"))
              local content = file:read("*a")
              file:close()
              return content
          end

          local currentHistory
          local currentState
          local capturedState
          local explodeTurnInitializer = false

          local moduleSources = {
              ["turnInitializer.lua"] = [[(function(triggerId, action)
                  if action ~= "prepareTurn" then error("unexpected action") end
                  if explodeTurnInitializer then error("expected turn initializer failure") end
                  return runScript(
                      triggerId,
                      "battleHistory",
                      "validate",
                      currentHistory,
                      currentState,
                      {}
                  )
              end)]],
              ["battleHistory.lua"] = [[(function(_, action, _, state)
                  if action ~= "validate" then error("unexpected action") end
                  capturedState = state
                  return { ok = true, schemaVersion = 1, errors = {} }
              end)]],
          }

          getLoreBooks = function(_, name)
              local source = moduleSources[name]
              if source == nil then return {} end
              return { { content = source } }
          end
          getChatVar = function() return nil end
          setChatVar = function() end
          getName = function() return "test" end
          getCharacterFirstMessage = function() return "hello" end
          print = function() end

          local chunk = assert(load(
              "return" .. readFile("System/runtime.lua"),
              "@System/runtime.lua",
              "t",
              _G
          ))
          local runtime = chunk()
          assert(type(runtime) == "function")
          assert(runtime(nil, "install") == true)
          runtime(nil, "beginEvent", "test")

          currentHistory = {
              schemaVersion = 1,
              kind = "battleHistory",
              turns = {
                  {
                      turnId = "battle-001-turn-001",
                      finish = {
                          stealth = 20,
                          resistance = 14,
                          mood = "suspicion",
                          status = "active",
                      },
                  },
              },
          }
          currentState = {
              status = "active",
              turnNumber = 2,
              lastCommittedTurnId = "battle-001-turn-001",
              player = { stealth = 18 },
              character = { resistance = 17, mood = "anger" },
          }

          local report = runtime(nil, "run", "turnInitializer", "prepareTurn")
          assert(report.ok == true)
          assert(capturedState ~= currentState)
          assert(capturedState.player ~= currentState.player)
          assert(capturedState.character ~= currentState.character)
          assert(capturedState.player.stealth == 20)
          assert(capturedState.character.resistance == 14)
          assert(capturedState.character.mood == "suspicion")
          assert(currentState.player.stealth == 18)
          assert(currentState.character.resistance == 17)
          assert(currentState.character.mood == "anger")

          currentState.turnStartReceipt = {
              baseline = { stealth = 20, resistance = 14, mood = "suspicion" },
          }
          runtime(nil, "run", "turnInitializer", "prepareTurn")
          assert(capturedState.character.resistance == 14)

          currentState.turnStartReceipt.baseline.resistance = 999
          runtime(nil, "run", "turnInitializer", "prepareTurn")
          assert(capturedState == currentState)
          assert(capturedState.character.resistance == 17)

          currentState.turnStartReceipt = nil
          runtime(nil, "run", "battleHistory", "validate", currentHistory, currentState, {})
          assert(capturedState == currentState)

          explodeTurnInitializer = true
          local failedReport = runtime(nil, "run", "turnInitializer", "prepareTurn")
          assert(failedReport == nil)
          local diagnostics = runtime(nil, "diagnostics")
          assert(diagnostics.turnInitializationDepth == 0)

          print("runtime integration policy check passed")
          ''', encoding="utf-8")

          output_test = Path("Tests/output-ui-anchor-recovery-check.lua")
          output_source = output_test.read_text(encoding="utf-8")
          output_source = output_source.replace(
              'assert(source:find(\'installBootstrapHandler(triggerId, "runtimePolicy")\', 1, true))\n',
              '',
          )
          output_source = output_source.replace(
              'RUNTIME_BUNDLE_REVISION = "runtime-bundle-turn-start-history-policy-v1-20260805"',
              'RUNTIME_BUNDLE_REVISION = "runtime-bundle-turn-start-history-integrated-v1-20260805"',
          )
          output_source = output_source.replace(
              "\nprint(\"onOutput UI anchor recovery check passed\")\n",
              "\nassert(not source:find(\"runtimePolicy\", 1, true))\n\nprint(\"onOutput UI anchor recovery check passed\")\n",
          )
          output_test.write_text(output_source, encoding="utf-8")

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Verify integration
        run: |
          luac5.4 -p System/main.lua
          luac5.4 -p System/runtime.lua
          lua5.4 Tests/runtime-policy-check.lua
          lua5.4 Tests/output-ui-anchor-recovery-check.lua
          ! grep -q "runtimePolicy" System/main.lua
          grep -q "local function projectHistoryValidationState" System/runtime.lua
          git diff --check

      - name: Commit integrated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add System/main.lua System/runtime.lua Tests/runtime-policy-check.lua Tests/output-ui-anchor-recovery-check.lua
          git diff --cached --check
          git commit -m "refactor: integrate runtime policy into runtime"

      - name: Remove temporary policy and tests
        run: |
          rm -f System/runtimePolicy.lua
          rm -rf Tests
          rm -f .github/workflows/integrate-runtime-policy.yml
          git add -A
          git diff --cached --check
          git commit -m "chore: remove temporary runtime integration tests"
          git push origin HEAD:fix/preserve-ui-anchor-on-output-failure
