name: Apply CBS shared popover from main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run CBS shared popover build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build clean experiment commit
        shell: bash
        run: |
          set -euo pipefail
          branch="perf/consolidate-battleui-popover-bank"
          workflow_path=".github/workflows/apply-cbs-shared-popover-main.yml"
          expected_parent="ce7be541d43d68cdfdee72d4762a52c85d752199"
          expected_html_blob="37cef2a5bbbb0fda692abf7e4491338c6293bfdd"
          expected_controller_blob="416ebc9fda2d5f9e975dffd0169067086cec0610"

          [[ "$(git rev-parse HEAD^)" == "$expected_parent" ]]
          git fetch origin "$branch"
          staging_sha="$(git rev-parse "origin/$branch")"
          git show "origin/$branch:.github/scripts/transform_shared_popover.py" > /tmp/transform_shared_popover.py
          git show "origin/$branch:System/popoverController.lua" > /tmp/popoverController.lua

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm "$workflow_path"
          git commit -m "chore: remove one-shot CBS popover workflow"
          git push origin HEAD:main
          clean_main_sha="$(git rev-parse HEAD)"

          git switch --detach "$clean_main_sha"
          cp /tmp/popoverController.lua System/popoverController.lua
          python3 /tmp/transform_shared_popover.py

          python3 - <<'PY'
          from pathlib import Path
          controller = Path('System/popoverController.lua').read_text(encoding='utf-8')
          template = Path('html/battleui.html').read_text(encoding='utf-8')
          required = (
              '(function(triggerId, action, ...)',
              'battlePopoverKind',
              'battlePopoverId',
              'battlePopoverTurnId',
              'battlePopoverToken',
              'loadLores',
              'setChatVar',
              'action == "open"',
              'action == "close"',
          )
          missing = [item for item in required if item not in controller]
          if missing:
              raise SystemExit(f'missing controller markers: {missing}')
          if '<script' in template.lower() or 'javascript:' in template.lower():
              raise SystemExit('JavaScript found')
          PY

          if command -v luac >/dev/null 2>&1; then
            luac -p System/popoverController.lua
          fi
          git diff --check
          [[ "$(git diff --name-only | sort)" == $'System/popoverController.lua\nhtml/battleui.html' ]]
          [[ "$(git hash-object html/battleui.html)" == "$expected_html_blob" ]]
          [[ "$(git hash-object System/popoverController.lua)" == "$expected_controller_blob" ]]

          before_bytes="$(git show "$clean_main_sha":html/battleui.html | wc -c | tr -d ' ')"
          after_bytes="$(wc -c < html/battleui.html | tr -d ' ')"
          open_commands="$(grep -o 'risu-btn="popoverController|open|' html/battleui.html | wc -l | tr -d ' ')"
          shared_popovers="$(grep -o 'id="ht-shared-popover"' html/battleui.html | wc -l | tr -d ' ')"

          git add System/popoverController.lua html/battleui.html
          git commit -m "perf: CBS 공통 팝오버로 DOM 복제 제거" \
            -m "팝오버 선택 키만 chatVar에 기록하고 battleui CBS를 다시 평가합니다." \
            -m "JavaScript 없이 모든 상세정보와 효과 선택을 단일 모달 DOM에서 렌더링합니다." \
            -m "template bytes: ${before_bytes} -> ${after_bytes}; shared popovers: ${shared_popovers}; open triggers: ${open_commands}"
          git push --force-with-lease="refs/heads/${branch}:${staging_sha}" origin "HEAD:${branch}"
