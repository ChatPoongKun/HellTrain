name: Apply mood tail projector fix

on:
  push:
    branches:
      - fix/mood-tail-projector
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event_name == 'push' || github.head_ref == 'fix/mood-tail-projector'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mood-tail-projector
          fetch-depth: 0

      - name: Apply contract fix
        run: python3 .github/scripts/apply_mood_tail_projector_fix.py

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Validate Lua and regression paths
        shell: bash
        run: |
          set -euo pipefail
          git diff -- System/turnEventProjector.lua
          luac5.4 -p System/turnEventProjector.lua
          luac5.4 -p System/main.lua
          luac5.4 -p Tests/mood-tail-projector-check.lua
          lua5.4 Tests/mood-tail-projector-check.lua
          lua5.4 Tests/character-mood-score-check.lua
          git diff --check
          test "$(git diff --name-only)" = $'System/main.lua\nSystem/turnEventProjector.lua'

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/apply_mood_tail_projector_fix.py
          rm .github/workflows/apply-mood-tail-projector-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: validate mood-state turn tail events"
          git push origin HEAD:fix/mood-tail-projector
