name: Apply Risu CBS portrait binding

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'automation/trigger-battleui-character-portrait'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace static portrait URLs with Risu img CBS
        shell: bash
        run: |
          set -euo pipefail
          workflow_path=".github/workflows/apply-battleui-cbs-image.yml"

          git fetch origin main
          git switch -C main origin/main

          python3 - <<'PY'
          from pathlib import Path

          path = Path("html/battleui.html")
          text = path.read_text(encoding="utf-8")
          name = "{{dict_element::{{dict_element::{{getvar::battleView}}::character}}::name}}"
          character_id = "{{dict_element::{{dict_element::{{getvar::battleView}}::character}}::id}}"
          lines = text.splitlines(keepends=True)

          start_marker = "{{#if {{equal::" + character_id + "::han_jenny}}}}"
          end_marker = "{{#if {{equal::" + character_id + "::yoon_seoa}}}}"
          start = next((index for index, line in enumerate(lines) if start_marker in line), None)
          end = next((index for index, line in enumerate(lines) if end_marker in line), None)
          if start is None or end is None or start > end:
              raise RuntimeError("current five-character portrait block was not found")

          newline = "\r\n" if lines[start].endswith("\r\n") else "\n"
          image_cbs = "{{img::" + name + "}}"
          replacement = f'<img src="{image_cbs}" alt="{name}" />' + newline
          lines[start:end + 1] = [replacement]
          updated = "".join(lines)
          path.write_text(updated, encoding="utf-8", newline="")

          if updated.count(image_cbs) != 1:
              raise RuntimeError("Risu img CBS binding was not added exactly once")
          if "{{source::char}}" in updated:
              raise RuntimeError("legacy host character image binding remains")
          if "https://raw.githubusercontent.com/ChatPoongKun/HellTrain/main/imgs/" in updated:
              raise RuntimeError("static GitHub portrait URL remains")
          for character_key in ("han_jenny", "seo_miryeong", "sister_agnes", "yoo_jiyoung", "yoon_seoa"):
              if "equal::" + character_id + "::" + character_key in updated:
                  raise RuntimeError(f"static character branch remains: {character_key}")
          print("validated dynamic Risu {{img::characterName}} portrait binding")
          PY

          git rm "$workflow_path"
          git diff --check HEAD
          changed="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' "$workflow_path" 'html/battleui.html' | sort)"
          if [[ "$changed" != "$expected" ]]; then
            echo "unexpected changed files" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$changed" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: battle UI 캐릭터 이미지를 Risu CBS로 호출" \
            -m "선택된 전투 상대 이름을 {{img::캐릭터명}}에 전달해 리수의 캐릭터 이미지를 표시합니다."
          git push origin HEAD:main
