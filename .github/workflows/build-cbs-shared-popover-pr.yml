name: Build CBS shared popover experiment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'perf/consolidate-battleui-popover-bank' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Transform and validate
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'id="ht-shared-popover"' html/battleui.html; then
            echo 'already transformed'
            exit 0
          fi
          python3 .github/scripts/transform_shared_popover.py
          if command -v luac >/dev/null 2>&1; then
            luac -p System/popoverController.lua
          fi
          git diff --check
          [[ "$(git diff --name-only)" == "html/battleui.html" ]]
          [[ "$(git hash-object html/battleui.html)" == "37cef2a5bbbb0fda692abf7e4491338c6293bfdd" ]]
          [[ "$(git hash-object System/popoverController.lua)" == "416ebc9fda2d5f9e975dffd0169067086cec0610" ]]

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add html/battleui.html
          git commit -m "perf: build CBS shared popover template"
          git push origin "HEAD:${{ github.head_ref }}"
