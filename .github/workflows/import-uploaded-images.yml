name: Import uploaded images

on:
  push:
    branches: [main]
    paths:
      - .upload_ready

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode uploaded images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p imgs
          cat .upload_chunks/1000057235.* | tr -d '\n\r ' | base64 -d > imgs/1000057235.png
          cat .upload_chunks/1000057236.* | tr -d '\n\r ' | base64 -d > imgs/1000057236.png
          cat .upload_chunks/1000057234.* | tr -d '\n\r ' | base64 -d > imgs/1000057234.png
          cat .upload_chunks/1000057237.* | tr -d '\n\r ' | base64 -d > imgs/1000057237.png
          rm -rf .upload_chunks .upload_ready
          rm -f .github/workflows/import-uploaded-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decode uploaded image assets"
          git push origin HEAD:main
