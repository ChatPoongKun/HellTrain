name: Temporary selection offset fix

on:
  push:
    branches:
      - balance/character-mood-token-pressure

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix selection weight offset validator
        run: |
          python - <<'PY'
          from pathlib import Path

          selector_path = Path('System/characterSelector.lua')
          schema_path = Path('System/stateSchema.lua')
          selector = selector_path.read_text(encoding='utf-8')
          schema = schema_path.read_text(encoding='utf-8')

          selector_formula = 'local weightOffset = minimumScore <= 0 and (1 - minimumScore) or 0'
          old = 'expectedOffset = anyPositivePoolScore and 0 or (1 - minimumPoolScore)'
          new = 'expectedOffset = minimumPoolScore <= 0 and (1 - minimumPoolScore) or 0'

          if selector_formula not in selector:
              raise SystemExit('characterSelector weight offset formula changed unexpectedly')

          old_count = schema.count(old)
          new_count = schema.count(new)
          if old_count == 1:
              schema = schema.replace(old, new)
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(f'unexpected stateSchema formula counts: old={old_count}, new={new_count}')

          schema_path.write_text(schema, encoding='utf-8')
          if schema.count(new) != 1 or old in schema:
              raise SystemExit('stateSchema weight offset formula replacement verification failed')
          PY
      - name: Regression check mixed-sign candidate scores
        run: |
          python - <<'PY'
          def selector_offset(scores):
              minimum = min(scores)
              return (1 - minimum) if minimum <= 0 else 0

          def validator_offset(scores):
              minimum = min(scores)
              return (1 - minimum) if minimum <= 0 else 0

          cases = [
              ([-3, 2, 5], 4),
              ([-1, 1, 7], 2),
              ([0, 2, 4], 1),
              ([1, 2, 4], 0),
              ([-4, -2, -1], 5),
          ]
          for scores, expected in cases:
              actual_selector = selector_offset(scores)
              actual_validator = validator_offset(scores)
              assert actual_selector == expected, (scores, actual_selector, expected)
              assert actual_validator == expected, (scores, actual_validator, expected)
              weights = [max(1, score + actual_selector) for score in scores]
              assert min(weights) >= 1
          print('selection weight offset regression cases passed')
          PY
      - name: Install build dependencies
        run: python -m pip install -r build/requirements.txt
      - name: Build CHARX
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python build/risucard.py
          test -s build/HellTrain.charx
      - name: Commit fix and CHARX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add System/stateSchema.lua build/HellTrain.charx
          git diff --cached --quiet && exit 0
          git commit -m "fix: align character selection weight offset validation"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: HellTrain-selection-offset-fix
          path: build/HellTrain.charx
          if-no-files-found: error
