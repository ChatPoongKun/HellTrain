name: Fix battle log bridge

on:
  push:
    branches:
      - feature/battle-history-log

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/battle-history-log
          fetch-depth: 0

      - name: Apply bridge fixes
        run: python3 tools/fix_battle_log_bridge.py

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Check Lua module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files = [
              'System/battleHistory.lua',
              'System/battleController.lua',
              'System/dataBridge.lua',
              'System/stateSchema.lua',
              'System/turnResolver.lua',
              'System/triggerPipeline.lua',
              'System/characterSelector.lua',
              'System/battleRuntime.lua',
              'System/viewBuilder.lua',
          ]
          for path in files:
              source = Path(path).read_text(encoding='utf-8')
              wrapper = Path('/tmp/check.lua')
              wrapper.write_text(
                  'local chunk, err = load([====[return ' + source + ']====], "@' + path + '")\nassert(chunk, err)\n',
                  encoding='utf-8',
              )
              subprocess.run(['lua5.4', str(wrapper)], check=True)
          PY

      - name: Run battle history test
        run: lua5.4 Tests/battle-history-check.lua

      - name: Verify bridge contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bridge = Path('System/dataBridge.lua').read_text(encoding='utf-8')
          history = Path('System/battleHistory.lua').read_text(encoding='utf-8')
          test = Path('Tests/battle-history-check.lua').read_text(encoding='utf-8')
          assert 'battleLogView = {' in bridge
          assert 'action = "validatePublicView"' in bridge
          assert 'local function validatePublicView(view)' in history
          assert 'elseif action == "validatePublicView" then' in history
          assert 'battle_log_entry_label_mismatch' in test
          PY

      - name: Remove temporary files
        run: rm -f tools/fix_battle_log_bridge.py .github/workflows/fix-battle-log-bridge.yml

      - name: Commit bridge fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: register and validate the battle log view"
          git push origin HEAD:feature/battle-history-log
