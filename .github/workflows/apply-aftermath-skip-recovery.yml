name: Apply aftermath skip recovery

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/skip-aftermath-to-destination'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/skip-aftermath-to-destination
          fetch-depth: 0

      - name: Apply recovery patch
        run: python .github/scripts/patch-aftermath-skip-recovery.py

      - name: Verify Lua syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          { printf 'return '; cat System/battleController.lua; } | luac5.4 -p -

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add System/battleController.lua
          git diff --cached --check
          git commit -m "fix: 목적지 건너뛰기 정산 복구 보강"
          git push origin HEAD:feat/skip-aftermath-to-destination
