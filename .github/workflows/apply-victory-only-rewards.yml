name: Apply victory-only reward patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/apply-victory-only-rewards.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/victory-only-rewards

      - name: Patch progression and reward UI
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          progression = "System/runProgression.lua"

          replace_once(
              progression,
              '''        if offer.kind == "none" then
              if choice.kind ~= "none" then
                  return nil, {
                      makeError(
                          "reward_choice_mismatch",
                          path .. ".kind",
                          "보상 카드가 없을 때는 continue 선택만 사용할 수 있습니다."
                      ),
                  }
              end
              return copyArray(deck), nil
          end
          if choice.kind ~= "card" or not contains(offer.cardIds, choice.cardId) then
          ''',
              '''        if choice.kind == "none" then
              return copyArray(deck), nil
          end
          if offer.kind == "none" then
              return nil, {
                  makeError(
                      "reward_choice_mismatch",
                      path .. ".kind",
                      "보상 카드가 없을 때는 continue 선택만 사용할 수 있습니다."
                  ),
              }
          end
          if choice.kind ~= "card" or not contains(offer.cardIds, choice.cardId) then
          ''',
          )

          replace_once(
              progression,
              '''            local rewardOffer, afterRewardRng, rewardErrors = generateRewardOffer(
                  setup.setupId,
                  sessionIndex,
                  rng,
                  settlement,
                  deck,
                  playerPool
              )
              if rewardErrors then
                  return nil, rewardErrors
              end
              rng = afterRewardRng
              local canonicalRecord = makeSessionRecord(settlement)
              canonicalSessions[sessionIndex] = canonicalRecord

              if inputRecord.rewardChoice == nil then
                  if sessionIndex ~= sessionCount then
                      return nil, {
                          makeError(
                              "incomplete_historical_session",
                              recordPath .. ".rewardChoice",
                              "마지막 항목이 아닌 정산 이력에는 보상 선택이 필요합니다."
                          ),
                      }
                  end
                  return buildState(
                      setup.setupId,
                      "reward",
                      canonicalSessions,
                      rng,
                      deck,
                      stats,
                      rewardOffer
                  ), nil
              end

              local rewardChoice, choiceErrors = validateRewardChoice(
                  inputRecord.rewardChoice,
                  recordPath .. ".rewardChoice"
              )
              if choiceErrors then
                  return nil, choiceErrors
              end
              local nextDeck, applyErrors = applyRewardChoice(
                  rewardOffer,
                  rewardChoice,
                  deck,
                  playerPool,
                  recordPath .. ".rewardChoice"
              )
              if applyErrors then
                  return nil, applyErrors
              end
              deck = nextDeck
              canonicalRecord.rewardChoice = rewardChoice
          ''',
              '''            local canonicalRecord = makeSessionRecord(settlement)
              canonicalSessions[sessionIndex] = canonicalRecord

              if settlement.status == "victory" then
                  local rewardOffer, afterRewardRng, rewardErrors = generateRewardOffer(
                      setup.setupId,
                      sessionIndex,
                      rng,
                      settlement,
                      deck,
                      playerPool
                  )
                  if rewardErrors then
                      return nil, rewardErrors
                  end
                  rng = afterRewardRng

                  if inputRecord.rewardChoice == nil then
                      if sessionIndex ~= sessionCount then
                          return nil, {
                              makeError(
                                  "incomplete_historical_session",
                                  recordPath .. ".rewardChoice",
                                  "마지막 항목이 아닌 승리 정산 이력에는 보상 선택이 필요합니다."
                              ),
                          }
                      end
                      return buildState(
                          setup.setupId,
                          "reward",
                          canonicalSessions,
                          rng,
                          deck,
                          stats,
                          rewardOffer
                      ), nil
                  end

                  local rewardChoice, choiceErrors = validateRewardChoice(
                      inputRecord.rewardChoice,
                      recordPath .. ".rewardChoice"
                  )
                  if choiceErrors then
                      return nil, choiceErrors
                  end
                  local nextDeck, applyErrors = applyRewardChoice(
                      rewardOffer,
                      rewardChoice,
                      deck,
                      playerPool,
                      recordPath .. ".rewardChoice"
                  )
                  if applyErrors then
                      return nil, applyErrors
                  end
                  deck = nextDeck
                  canonicalRecord.rewardChoice = rewardChoice
              else
                  if inputRecord.rewardChoice ~= nil then
                      local rewardChoice, choiceErrors = validateRewardChoice(
                          inputRecord.rewardChoice,
                          recordPath .. ".rewardChoice"
                      )
                      if choiceErrors then
                          return nil, choiceErrors
                      end
                      if rewardChoice.kind ~= "none" then
                          return nil, {
                              makeError(
                                  "reward_not_allowed_after_defeat",
                                  recordPath .. ".rewardChoice",
                                  "패배한 세션에서는 카드 보상을 획득할 수 없습니다."
                              ),
                          }
                      end
                  end
                  canonicalRecord.rewardChoice = {
                      kind = "none",
                  }
              end
          ''',
          )

          replace_once(
              progression,
              '''        if current.rewardOffer.kind == "none" and command.cardId == "continue" then
          ''',
              '''        if command.cardId == "continue" then
          ''',
          )

          post_battle = "html/postBattle.html"
          replace_once(
              post_battle,
              '''.run-flow .run-confirm:focus-visible,
          .run-flow .run-continue:focus-visible {
          outline: 2px solid #fff;
          outline-offset: 2px;
          }

          .run-flow .run-none-reward,
          ''',
              '''.run-flow .run-confirm:focus-visible,
          .run-flow .run-continue:focus-visible {
          outline: 2px solid #fff;
          outline-offset: 2px;
          }

          .run-flow .run-reward-skip {
          text-align: center;
          }

          .run-flow .run-none-reward,
          ''',
          )

          replace_once(
              post_battle,
              '''<span class="run-instruction">첫 클릭: 상세 확인 · 열린 카드 아래 버튼: 보상 확정</span>
          ''',
              '''<span class="run-instruction">첫 클릭: 상세 확인 · 열린 카드 아래 버튼: 보상 확정 · 원치 않으면 선택하지 않기</span>
          ''',
          )

          replace_once(
              post_battle,
              '''{{/each}}
          </div>
          {{/when}}
          {{#when::keep::{{dictelement::{{tempvar::run_progression_reward}}::kind}}::is::none}}
          ''',
              '''{{/each}}
          </div>
          <div class="run-reward-skip">
          <button
          class="run-continue"
          type="button"
          risu-btn="init|choose|continue|{{dictelement::{{tempvar::run_progression_reward}}::interactionToken}}"
          aria-label="카드 보상을 선택하지 않고 현재 덱으로 계속"
          >선택하지 않기</button>
          </div>
          {{/when}}
          {{#when::keep::{{dictelement::{{tempvar::run_progression_reward}}::kind}}::is::none}}
          ''',
          )

          design_path = Path("Design.txt")
          design = design_path.read_text(encoding="utf-8")
          pattern = re.compile(r"현재 전투 후 루프의 v1 수직 슬라이스에서는 승리와 패배 모두[^\n]*\n")
          replacement = (
              "현재 전투 후 루프의 v1 수직 슬라이스에서는 승리한 경우에만 보유량이 두 장 미만인 플레이어 카드 중 결정론적으로 제시된 최대 3장 가운데 하나를 보상으로 획득한다. 플레이어는 제시된 카드를 선택하지 않고 현재 덱을 유지할 수도 있다. 덱이 20장이거나 적격 카드가 없으면 카드 없이 계속한다. 패배한 경우에는 보상 제안과 보상 RNG 처리를 생략하고 바로 다음 상대 선택으로 이동한다. 이후 결정론적으로 제시된 캐릭터 3명 중 다음 상대를 선택하고 새로운 전투를 시작한다. 위 네 가지 보상 유형 선택은 퍽 DB, 카드 성능 등급과 교체 UI가 확정된 뒤 이 흐름 위에 확장한다.\n"
          )
          design, count = pattern.subn(replacement, design, count=1)
          if count != 1:
              raise SystemExit(f"Design.txt: expected one reward-flow paragraph, found {count}")
          design_path.write_text(design, encoding="utf-8")

          progression_text = Path(progression).read_text(encoding="utf-8")
          post_battle_text = Path(post_battle).read_text(encoding="utf-8")
          assert 'if settlement.status == "victory" then' in progression_text
          assert 'reward_not_allowed_after_defeat' in progression_text
          assert 'if command.cardId == "continue" then' in progression_text
          assert '>선택하지 않기</button>' in post_battle_text
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          if command -v luac >/dev/null 2>&1; then
            luac -p System/runProgression.lua
          fi
          git diff -- System/runProgression.lua html/postBattle.html Design.txt

      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/apply-victory-only-rewards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add System/runProgression.lua html/postBattle.html Design.txt .github/workflows/apply-victory-only-rewards.yml
          git commit -m "feat: grant post-battle rewards only on victory"
          git push origin HEAD:feature/victory-only-rewards
