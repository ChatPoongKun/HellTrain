name: Apply aftermath destination skip

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/skip-aftermath-to-destination'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/skip-aftermath-to-destination
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply-aftermath-skip.py

      - name: Verify Lua syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          { printf 'return '; cat System/battleController.lua; } | luac5.4 -p -
          luac5.4 -p System/main.lua

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add System/battleController.lua System/main.lua html/battleui.html html/embeddings.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m "feat: 조기 승리 후 목적지 바로가기 추가"
          git push origin HEAD:feat/skip-aftermath-to-destination
