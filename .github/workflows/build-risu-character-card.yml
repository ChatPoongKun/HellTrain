name: Build RisuAI character card

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "System/**"
      - "DB/**"
      - "Char/**"
      - "Prompt/**"
      - "html/**"
      - "imgs/**"
      - "build/**"
      - ".github/workflows/build-risu-character-card.yml"
  push:
    branches:
      - main
    paths:
      - "System/**"
      - "DB/**"
      - "Char/**"
      - "Prompt/**"
      - "html/**"
      - "imgs/**"
      - "build/**"
      - ".github/workflows/build-risu-character-card.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install card build dependencies
        run: python -m pip install -r build/requirements.txt

      - name: Build and verify character card
        run: python build/build_risu_card.py

      - name: Upload character card
        uses: actions/upload-artifact@v4
        with:
          name: HellTrain-risu-card
          path: |
            build/HellTrain.charx
            build/HellTrain.jpg
          if-no-files-found: error
          retention-days: 14
