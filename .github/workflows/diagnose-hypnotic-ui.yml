name: Diagnose hypnotic UI regression

on:
  push:
    branches:
      - fix/mood-tail-projector

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mood-tail-projector
      - name: Inventory tests and controller references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== test files ==='
          find Tests .agents -maxdepth 3 -type f 2>/dev/null | sort || true
          echo '=== battle controller references ==='
          grep -RIl 'battleController' Tests .agents 2>/dev/null | sort || true
          echo '=== hypnotic references ==='
          grep -RIn 'hypnotic_whisper\|최면의 속삭임' Tests .agents System DB 2>/dev/null || true
