name: Diagnose hypnotic UI regression

on:
  push:
    branches:
      - fix/mood-tail-projector
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mood-tail-projector
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Run hypnotic runtime commit trace
        shell: bash
        run: |
          set -euo pipefail
          lua5.4 Tests/hypnotic-runtime-commit-check.lua
