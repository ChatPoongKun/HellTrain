name: Apply battleUI aftermath hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-battleui-aftermath-hotfix.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/battleui-aftermath-image-key
          path: target
          fetch-depth: 0
      - name: Checkout main for cleanup
        uses: actions/checkout@v4
        with:
          ref: main
          path: default
          fetch-depth: 0
      - name: Patch view and battleUI
        shell: bash
        run: |
          cd target
          python - <<'PY'
          from pathlib import Path

          view_path = Path('System/viewBuilder.lua')
          view = view_path.read_text(encoding='utf-8')

          old_build = '''            character = {
                id = characterDefinition.id,
                name = characterDefinition.name,
                resistance = displayState.character.resistance,'''
          new_build = '''            character = {
                id = characterDefinition.id,
                name = characterDefinition.name,
                imageName = characterDefinition.name .. (aftermathInput ~= nil and "_함락" or ""),
                resistance = displayState.character.resistance,'''
          if view.count(old_build) != 1:
              raise SystemExit(f'viewBuilder build anchor count: {view.count(old_build)}')
          view = view.replace(old_build, new_build, 1)

          old_allowed = '''                id = true,
                name = true,
                resistance = true,'''
          new_allowed = '''                id = true,
                name = true,
                imageName = true,
                resistance = true,'''
          if view.count(old_allowed) != 1:
              raise SystemExit(f'viewBuilder allowed-key anchor count: {view.count(old_allowed)}')
          view = view.replace(old_allowed, new_allowed, 1)

          old_validation = '''            if not isAsciiId(view.character.id) or type(view.character.name) ~= "string" then
                addError(errors, "invalid_character_value", "$.character", "캐릭터 표시 값이 올바르지 않습니다.")
            end'''
          new_validation = '''            if not isAsciiId(view.character.id)
                or type(view.character.name) ~= "string"
                or type(view.character.imageName) ~= "string"
                or view.character.imageName == "" then
                addError(errors, "invalid_character_value", "$.character", "캐릭터 표시 값이 올바르지 않습니다.")
            end'''
          if view.count(old_validation) != 1:
              raise SystemExit(f'viewBuilder validation anchor count: {view.count(old_validation)}')
          view = view.replace(old_validation, new_validation, 1)
          view_path.write_text(view, encoding='utf-8')

          ui_path = Path('html/battleui.html')
          ui = ui_path.read_text(encoding='utf-8')
          old_ui = '''<div class="ht-portrait">
{{#if {{equal::{{dict_element::{{dict_element::{{getvar::battleView}}::outcome}}::status}}::victory}}}}
<img src="{{raw::{{dict_element::{{dict_element::{{getvar::battleView}}::character}}::name}}_함락}}" alt="{{dict_element::{{dict_element::{{getvar::battleView}}::character}}::name}} 함락" />
{{/if}}
{{#if {{not::{{equal::{{dict_element::{{dict_element::{{getvar::battleView}}::outcome}}::status}}::victory}}}}}}
<img src="{{raw::{{dict_element::{{dict_element::{{getvar::battleView}}::character}}::name}}}}" alt="{{dict_element::{{dict_element::{{getvar::battleView}}::character}}::name}}" />
{{/if}}
<div class="ht-character-name">
<strong>{{dict_element::{{dict_element::{{getvar::battleView}}::character}}::name}}</strong>
{{#if {{equal::{{dict_element::{{dict_element::{{getvar::battleView}}::outcome}}::status}}::victory}}}}<span>CONQUERED TARGET</span>{{/if}}
{{#if {{not::{{equal::{{dict_element::{{dict_element::{{getvar::battleView}}::outcome}}::status}}::victory}}}}}}<span>ENCOUNTER TARGET</span>{{/if}}'''
          new_ui = '''<div class="ht-portrait">
<img src="{{raw::{{dict_element::{{dict_element::{{getvar::battleView}}::character}}::imageName}}}}" alt="{{dict_element::{{dict_element::{{getvar::battleView}}::character}}::name}}" />
<div class="ht-character-name">
<strong>{{dict_element::{{dict_element::{{getvar::battleView}}::character}}::name}}</strong>
{{#if {{equal::{{dict_element::{{dict_element::{{getvar::battleView}}::aftermath}}::active}}::true}}}}<span>CONQUERED TARGET</span>{{/if}}
{{#if {{equal::{{dict_element::{{dict_element::{{getvar::battleView}}::aftermath}}::active}}::false}}}}<span>ENCOUNTER TARGET</span>{{/if}}'''
          if ui.count(old_ui) != 1:
              raise SystemExit(f'battleui anchor count: {ui.count(old_ui)}')
          ui = ui.replace(old_ui, new_ui, 1)
          ui_path.write_text(ui, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add System/viewBuilder.lua html/battleui.html
          git commit -m "fix: 조기 승리 함락 이미지 키를 View에서 계산"
          git push origin HEAD:fix/battleui-aftermath-image-key
      - name: Remove temporary workflow from main
        shell: bash
        run: |
          cd default
          rm .github/workflows/apply-battleui-aftermath-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-battleui-aftermath-hotfix.yml
          git commit -m "chore: remove temporary battleUI hotfix workflow"
          git push origin HEAD:main
