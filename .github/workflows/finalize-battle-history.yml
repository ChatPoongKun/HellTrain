name: Finalize battle history

on:
  push:
    branches:
      - feature/battle-history-log

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/battle-history-log
          fetch-depth: 0

      - name: Apply final fixes
        run: python3 tools/finalize_battle_history.py

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Check Lua module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files = [
              'System/battleHistory.lua',
              'System/battleController.lua',
              'System/stateSchema.lua',
              'System/turnResolver.lua',
              'System/triggerPipeline.lua',
              'System/characterSelector.lua',
              'System/battleRuntime.lua',
              'System/viewBuilder.lua',
          ]
          for path in files:
              source = Path(path).read_text(encoding='utf-8')
              wrapper = Path('/tmp/check.lua')
              wrapper.write_text(
                  'local chunk, err = load([====[return ' + source + ']====], "@' + path + '")\nassert(chunk, err)\n',
                  encoding='utf-8',
              )
              subprocess.run(['lua5.4', str(wrapper)], check=True)
          PY

      - name: Run battle history test
        run: lua5.4 Tests/battle-history-check.lua

      - name: Verify history integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          controller = Path('System/battleController.lua').read_text(encoding='utf-8')
          history = Path('System/battleHistory.lua').read_text(encoding='utf-8')
          test = Path('Tests/battle-history-check.lua').read_text(encoding='utf-8')
          docs = Path('docs/battle-history.md').read_text(encoding='utf-8')
          assert controller.count('local _, battleLogErrors = publishTerminalBattleLog(nextState, staticData)') == 1
          assert controller.count('local _, battleLogErrors = publishTerminalBattleLog(authority, staticData)') == 1
          assert 'for window = 1, MAX_TURNS do' in history
          assert '#value.windows ~= MAX_TURNS' in history
          assert 'previousTurn.finish.stealth' in docs
          assert 'context.context.windows[3].availableTurns == 1' in test
          assert 'context.context.windows[12].player.resolvedTagCounts.contact == 1' in test
          PY

      - name: Remove temporary files
        run: rm -f tools/finalize_battle_history.py .github/workflows/finalize-battle-history.yml

      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize battle history windows and terminal binding"
          git push origin HEAD:feature/battle-history-log
