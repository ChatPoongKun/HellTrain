name: Audit Lua roles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build audit bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | sort -z | xargs -0 -I{} cp --parents '{}' audit/
          for f in README.md README.rst README.txt package.json; do
            if [ -f "$f" ]; then cp --parents "$f" audit/; fi
          done
          find . -maxdepth 3 -type f \( -iname '*architecture*' -o -iname '*design*' -o -iname '*readme*' \) -not -path './.git/*' -print0 | xargs -0 -r -I{} cp --parents '{}' audit/
          find audit -type f -print | sort > audit/FILELIST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lua-role-audit
          path: audit
          if-no-files-found: error
