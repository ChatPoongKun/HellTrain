name: Temporary CHARX build

on:
  push:
    branches:
      - balance/action-economy-short-combat

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r build/requirements.txt
      - name: Build CHARX
        run: python build/risucard.py --output dist
      - name: Check output
        run: test -s dist/HellTrain.charx
      - uses: actions/upload-artifact@v4
        with:
          name: HellTrain-charx-pr23
          path: dist/HellTrain.charx
          if-no-files-found: error
