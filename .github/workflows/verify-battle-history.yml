name: Verify battle history

on:
  push:
    branches:
      - feature/battle-history-log
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/battle-history-log
          fetch-depth: 0

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Check Lua module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files = [
              'System/battleHistory.lua',
              'System/stateSchema.lua',
              'System/turnResolver.lua',
              'System/triggerPipeline.lua',
              'System/characterSelector.lua',
              'System/battleRuntime.lua',
              'System/viewBuilder.lua',
          ]
          for path in files:
              source = Path(path).read_text(encoding='utf-8')
              wrapper = Path('/tmp/check.lua')
              wrapper.write_text(
                  'local chunk, err = load([====[return ' + source + ']====], "@' + path + '")\nassert(chunk, err)\n',
                  encoding='utf-8',
              )
              subprocess.run(['lua5.4', str(wrapper)], check=True)
          PY

      - name: Run battle history test
        run: lua5.4 Tests/battle-history-check.lua

      - name: Remove temporary verification workflow
        run: rm -f .github/workflows/verify-battle-history.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove temporary battle history workflow"
          git push origin HEAD:feature/battle-history-log
