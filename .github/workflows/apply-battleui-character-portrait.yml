name: Apply battle UI character portrait patch

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'automation/trigger-battleui-character-portrait'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Connect selected character portraits to battle UI
        shell: bash
        run: |
          set -euo pipefail
          workflow_path=".github/workflows/apply-battleui-character-portrait.yml"
          expected_base="${{ github.event.pull_request.base.sha }}"

          git fetch origin main
          git switch -C main origin/main
          if [[ "$(git rev-parse HEAD)" != "$expected_base" ]]; then
            echo "main moved after the trigger PR was opened" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("html/battleui.html")
          text = path.read_text(encoding="utf-8")
          name = "{{dict_element::{{dict_element::{{getvar::battleView}}::character}}::name}}"
          character_id = "{{dict_element::{{dict_element::{{getvar::battleView}}::character}}::id}}"
          old = f'<img src="{{{{source::char}}}}" alt="{name}" />'
          portraits = [
              ("han_jenny", "HanJenny.png"),
              ("seo_miryeong", "SeoMiryeong.png"),
              ("sister_agnes", "SisterAgnes.png"),
              ("yoo_jiyoung", "YooJiyoung.png"),
              ("yoon_seoa", "YoonSeoa.png"),
          ]
          base = "https://raw.githubusercontent.com/ChatPoongKun/HellTrain/main/imgs/"
          replacement = "\n".join(
              f'{{{{#if {{{{equal::{character_id}::{character_key}}}}}}}}<img src="{base}{filename}" alt="{name}" />{{{{/if}}}}'
              for character_key, filename in portraits
          )

          if text.count(old) != 1:
              raise RuntimeError(f"expected one current portrait image, found {text.count(old)}")
          text = text.replace(old, replacement, 1)
          path.write_text(text, encoding="utf-8")

          rendered = path.read_text(encoding="utf-8")
          if "{{source::char}}" in rendered:
              raise RuntimeError("battle UI still references the host character avatar")
          for character_key, filename in portraits:
              condition = f"equal::{character_id}::{character_key}"
              url = base + filename
              if rendered.count(condition) != 1 or rendered.count(url) != 1:
                  raise RuntimeError(f"invalid portrait binding for {character_key}")
              image = Path("imgs") / filename
              if not image.is_file() or image.stat().st_size == 0:
                  raise RuntimeError(f"missing portrait asset: {image}")

          if rendered.count('<img src="https://raw.githubusercontent.com/ChatPoongKun/HellTrain/main/imgs/') != 5:
              raise RuntimeError("expected exactly five character portrait images")
          print("validated five selected-character portrait bindings")
          PY

          git rm "$workflow_path"
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' "$workflow_path" 'html/battleui.html' | sort)"
          if [[ "$changed" != "$expected" ]]; then
            echo "unexpected changed files" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$changed" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$workflow_path" html/battleui.html
          git commit -m "fix: battle UI에 선택 캐릭터 이미지 표시" \
            -m "전투 상대 ID에 따라 imgs 디렉터리의 캐릭터 PNG를 프로필 이미지로 렌더링합니다."
          git push origin HEAD:main
