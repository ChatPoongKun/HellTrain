name: PR UI anchor recovery fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-ui-anchor-on-output-failure
          fetch-depth: 0

      - name: Patch commit ordering
        shell: python
        run: |
          from pathlib import Path

          path = Path("System/battleController.lua")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              '        if binding.phase == "requestInjected" then\n            local chat, chatErrors = readChat()',
              '        -- 출력 관측 영수증은 먼저 내구성 있게 저장하되, 표시용 UI anchor는\n'
              '        -- 상태 commit과 다음 View 게시가 모두 성공할 때까지 보존한다.\n'
              '        local observedChat = nil\n'
              '        local observedUiAnchorLuaIndex = nil\n'
              '        if binding.phase == "requestInjected" then\n'
              '            local chat, chatErrors = readChat()',
              "observation prelude",
          )

          replace_once(
              '            -- 완성 출력이 실제 채팅에 도착한 것이 확인된 뒤에만 이전 UI를\n'
              '            -- 제거한다. 응답 자체는 그대로 두고 다음 onOutput UI anchor가\n'
              '            -- 응답 아래에 배치될 수 있도록 한다.\n'
              '            local _, _, uiRemoveErrors = removeUiAnchorAt(chat, topology.uiAnchorLuaIndex)\n'
              '            if uiRemoveErrors then return failure(uiRemoveErrors) end',
              '            observedChat = chat\n'
              '            observedUiAnchorLuaIndex = topology.uiAnchorLuaIndex',
              "early anchor removal",
          )

          replace_once(
              '        return success({\n'
              '            generationReady = false,\n'
              '            outputCommitted = true,\n'
              '            turnId = committed.turnId,',
              '        -- authority/draft/request와 canonical View가 모두 확정된 뒤에만\n'
              '        -- 이전 anchor를 정리한다. 정리 실패는 완료된 commit을 실패로\n'
              '        -- 되돌리지 않으며 hostFlow가 새 anchor를 계속 생성할 수 있게 한다.\n'
              '        local removedUiAnchor = false\n'
              '        local uiAnchorCleanupError = nil\n'
              '        if observedChat ~= nil then\n'
              '            local _, removed, uiRemoveErrors = removeUiAnchorAt(\n'
              '                observedChat,\n'
              '                observedUiAnchorLuaIndex\n'
              '            )\n'
              '            removedUiAnchor = removed == true\n'
              '            if uiRemoveErrors then\n'
              '                uiAnchorCleanupError = uiRemoveErrors[1]\n'
              '                if type(debug) == "function" then\n'
              '                    local detail = type(uiAnchorCleanupError) == "table"\n'
              '                        and uiAnchorCleanupError.message\n'
              '                        or uiAnchorCleanupError\n'
              '                    debug(1, "commitOutput: output committed but previous UI anchor cleanup failed: "\n'
              '                        .. tostring(detail))\n'
              '                end\n'
              '            end\n'
              '        end\n\n'
              '        return success({\n'
              '            generationReady = false,\n'
              '            outputCommitted = true,\n'
              '            turnId = committed.turnId,',
              "post-commit cleanup",
          )

          replace_once(
              '            view = published.view,\n'
              '            progressionState = progressionState,\n'
              '        })',
              '            view = published.view,\n'
              '            progressionState = progressionState,\n'
              '            removedUiAnchor = removedUiAnchor,\n'
              '            uiAnchorCleanupError = uiAnchorCleanupError,\n'
              '        })',
              "cleanup result fields",
          )

          path.write_text(source, encoding="utf-8")

      - name: Add regression guard
        run: |
          cat > Tests/ui-anchor-commit-order-check.lua <<'LUA'
          local file = assert(io.open("System/battleController.lua", "rb"))
          local source = file:read("*a")
          file:close()
          local observation = assert(source:find("local observedChat = nil", 1, true))
          local commitCall = assert(source:find('"commitPending"', observation, true))
          local authorityWrite = assert(source:find("writeStored(KEYS.authority, nextState)", commitCall, true))
          local cleanup = assert(source:find("authority/draft/request와 canonical View가 모두 확정된 뒤에만", authorityWrite, true))
          local removal = assert(source:find("removeUiAnchorAt(", cleanup, true))
          local success = assert(source:find("outputCommitted = true", removal, true))
          assert(observation < commitCall and commitCall < authorityWrite)
          assert(authorityWrite < cleanup and cleanup < removal and removal < success)
          assert(not source:find("removeUiAnchorAt(chat, topology.uiAnchorLuaIndex)", 1, true))
          print("ui anchor commit ordering check passed")
          LUA

      - name: Validate
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          luac5.4 -p System/battleController.lua
          lua5.4 Tests/ui-anchor-commit-order-check.lua
          git diff --check

      - name: Commit
        run: |
          rm -f .github/workflows/fix-ui-anchor-output-failure.yml
          rm -f .github/workflows/pr-ui-anchor-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve UI anchor until output commit succeeds"
          git push origin HEAD:fix/preserve-ui-anchor-on-output-failure
