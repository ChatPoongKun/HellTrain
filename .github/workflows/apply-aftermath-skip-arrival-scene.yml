name: Apply aftermath skip arrival scene

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/aftermath-skip-arrival-scene'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/aftermath-skip-arrival-scene
          fetch-depth: 0

      - name: Apply skip scene flow
        run: python .github/scripts/apply-aftermath-skip-arrival-scene.py

      - name: Verify Lua syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          { printf 'return '; cat System/battleController.lua; } | luac5.4 -p -
          luac5.4 -p System/main.lua

      - name: Commit product changes
        run: |
          rm -f .github/scripts/apply-aftermath-skip-arrival-scene.py .github/aftermath-skip-arrival-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: 목적지 바로가기 도착 장면 생성"
          git push origin HEAD:feat/aftermath-skip-arrival-scene
