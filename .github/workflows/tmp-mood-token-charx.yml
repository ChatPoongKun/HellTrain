name: Temporary mood token CHARX build

on:
  push:
    branches:
      - balance/character-mood-token-pressure

permissions:
  contents: write

jobs:
  rebalance-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebalance character mood cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('DB/CharacterCards.db')
          text = path.read_text(encoding='utf-8')

          def edit_card(card_id, replacements):
              global text
              pattern = re.compile(rf'(^        {re.escape(card_id)} = .*?^        \),\n)', re.MULTILINE | re.DOTALL)
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f'card block not found: {card_id}')
              block = match.group(1)
              for old, new in replacements:
                  if old not in block:
                      raise SystemExit(f'expected text missing in {card_id}: {old}')
                  block = block.replace(old, new, 1)
              text = text[:match.start(1)] + block + text[match.end(1):]

          edit_card('seoa_square_shoulders', [
              ('흐트러진 자세를 즉시 바로잡고 긍정 방향의 압력을 식힙니다.',
               '흐트러진 자세를 즉시 바로잡고 한 단계 부정 방향으로 흐름을 되돌립니다.'),
              ('{ "저항을 2 회복합니다.", "냉각 1." },',
               '{ "저항을 2 회복합니다.", "반발 1." },'),
              ('{ recoverResistance(2), cool(context, 1) }',
               '{ recoverResistance(2), backlash(context, 1) }'),
          ])

          edit_card('seoa_cut_off_exchange', [
              ('더 이상의 여지를 주지 않고 대화를 끊어 냉각과 반발을 동시에 만듭니다.',
               '더 이상의 여지를 주지 않고 대화를 끊어 강하게 반발합니다.'),
              ('{ "냉각 1.", "반발 1." },',
               '{ "반발 2." },'),
              ('{ cool(context, 1), backlash(context, 1) }',
               '{ backlash(context, 2) }'),
          ])

          edit_card('jenny_fix_makeup', [
              ('휴대전화 화면에 비친 표정을 고치며 흐름을 냉각하고 태연함을 되찾습니다.',
               '휴대전화 화면에 비친 표정을 고치며 태연함을 되찾고 상대의 흐름에 반발합니다.'),
              ('{ "저항을 2 회복합니다.", "냉각 1." },',
               '{ "저항을 2 회복합니다.", "반발 1." },'),
              ('{ recoverResistance(2), cool(context, 1) }',
               '{ recoverResistance(2), backlash(context, 1) }'),
          ])

          edit_card('miryeong_raised_palm', [
              ('다음 플레이어 카드가 선언되면 냉각 2.',
               '다음 플레이어 카드가 선언되면 반발 2.'),
              ('상대가 다시 움직이자 말없이 한 걸음 물러서며 시선을 끊고 분위기를 식힌다.',
               '상대가 다시 움직이자 말없이 한 걸음 더 물러서며 거부 의사를 분명히 드러낸다.'),
              ('{ cool(context, 2, "plan") }',
               '{ backlash(context, 2, "plan") }'),
          ])

          path.write_text(text, encoding='utf-8')

          def block(card_id):
              pattern = re.compile(rf'(^        {re.escape(card_id)} = .*?^        \),\n)', re.MULTILINE | re.DOTALL)
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f'cannot verify card: {card_id}')
              return match.group(1)

          converted = [
              'seoa_square_shoulders',
              'seoa_cut_off_exchange',
              'jenny_fix_makeup',
              'miryeong_raised_palm',
          ]
          for card_id in converted:
              if 'cool(context' in block(card_id):
                  raise SystemExit(f'cooling remained in converted card: {card_id}')
              if 'backlash(context' not in block(card_id):
                  raise SystemExit(f'backlash missing in converted card: {card_id}')

          retained = {
              'jiyoung': ['jiyoung_close_collar', 'jiyoung_avoid_eye_contact', 'jiyoung_phone_in_hand'],
              'seoa': ['seoa_cold_stare', 'seoa_silent_audit'],
              'jenny': ['jenny_redirect_attention'],
              'miryeong': ['miryeong_close_heart', 'miryeong_touch_wedding_ring'],
              'agnes': ['agnes_cover_with_sleeves', 'agnes_lower_eyes'],
          }
          for owner, ids in retained.items():
              for card_id in ids:
                  if 'cool(context' not in block(card_id):
                      raise SystemExit(f'expected cooling missing: {card_id}')
              print(f'{owner}: retained cooling cards = {len(ids)} ({", ".join(ids)})')
          PY
      - name: Install build dependencies
        run: python -m pip install -r build/requirements.txt
      - name: Build CHARX
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python build/risucard.py
          test -s build/HellTrain.charx
      - name: Commit balanced cards and CHARX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DB/CharacterCards.db build/HellTrain.charx
          git diff --cached --quiet && exit 0
          git commit -m "balance: shift character mood defense to token pressure"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: HellTrain-mood-token-balance
          path: build/HellTrain.charx
          if-no-files-found: error
