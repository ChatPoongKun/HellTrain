<!-- popup -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

.bg-orb {
position: absolute;
border-radius: 50%;
filter: blur(100px);
z-index: 0;
}
.orb-1 {
width: 400px;
height: 400px;
background: rgba(139, 92, 246, 0.2);
top: -100px;
left: -100px;
}
.orb-2 {
width: 300px;
height: 300px;
background: rgba(56, 189, 248, 0.2);
bottom: -50px;
right: -50px;
}

.popup-overlay {
position: fixed;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
z-index: 10;
padding: 1rem;
}

.popup-container {
width: 100%;
max-width: 520px;
background: rgba(30, 41, 59, 0.7);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 24px;
box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
overflow: hidden;
display: flex;
flex-direction: column;
animation: popupIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes popupIn {
0% { opacity: 0; transform: scale(0.95) translateY(20px); }
100% { opacity: 1; transform: scale(1) translateY(0); }
}

.popup-header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 0.1rem 1rem;
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
background: rgba(255, 255, 255, 0.02);
}

.popup-title {
font-size: 1.25rem;
font-weight: 600;
letter-spacing: 0.5px;
display: flex;
align-items: center;
gap: 0.5rem;
color: #fff;
}

.popup-title::before {
content: '';
display: block;
width: 4px;
height: 20px;
background: #38bdf8;
border-radius: 4px;
box-shadow: 0 0 10px #38bdf8;
}

.close-btn {
background: transparent;
border: none;
color: #94a3b8;
cursor: pointer;
width: 36px;
height: 36px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.2s ease;
}

.close-btn:hover {
background: rgba(255, 255, 255, 0.1);
color: white;
transform: rotate(90deg);
}

.mock-content {
padding: 1rem;
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 0.75rem;
overflow-y: auto;
max-height: 500px;
scroll-behavior: smooth;
}

.mock-content::-webkit-scrollbar {
width: 6px;
}
.mock-content::-webkit-scrollbar-track {
background: transparent;
}
.mock-content::-webkit-scrollbar-thumb {
background: rgba(255, 255, 255, 0.2);
border-radius: 10px;
}

.codex-card {
min-height: 128px;
padding: 1rem;
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.05);
border-radius: 16px;
transition: all 0.3s ease;
display: flex;
flex-direction: column;
justify-content: space-between;
position: relative;
overflow: hidden;
}

.codex-card:hover {
background: rgba(255, 255, 255, 0.08);
border-color: rgba(56, 189, 248, 0.3);
transform: translateY(-2px);
box-shadow: 0 10px 20px -10px rgba(0,0,0,0.4), 0 0 15px rgba(56, 189, 248, 0.1);
}

.codex-icon {
width: 42px;
height: 42px;
border-radius: 12px;
background: rgba(56, 189, 248, 0.1);
border: 1px solid rgba(56, 189, 248, 0.2);
display: flex;
align-items: center;
justify-content: center;
color: #38bdf8;
font-size: 1.3rem;
}

.codex-title {
font-size: 1rem;
font-weight: 600;
color: #fff;
margin-top: 0.75rem;
}

.codex-desc {
font-size: 0.82rem;
line-height: 1.4;
color: #94a3b8;
margin-top: 0.25rem;
}

.codex-state {
font-size: 0.72rem;
letter-spacing: 1px;
text-transform: uppercase;
color: #c4b5fd;
margin-top: 0.75rem;
}

@media (max-width: 600px) {
.popup-overlay {
padding: 0;
align-items: flex-end;
}
.popup-container {
max-width: 100%;
height: 100vh;
border-radius: 0;
border: none;
border-top: 1px solid rgba(255, 255, 255, 0.1);
animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.mock-content {
grid-template-columns: 1fr;
max-height: none;
flex: 1;
}
@keyframes slideUp {
0% { transform: translateY(100%); }
100% { transform: translateY(0); }
}
}
</style>

<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>

<div class="popup-overlay">
<div class="popup-container">
<div class="popup-header">
<div class="popup-title">도감</div>
<button class="close-btn" aria-label="닫기" risu-btn="popupManage|close">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<line x1="18" y1="6" x2="6" y2="18"></line>
<line x1="6" y1="6" x2="18" y2="18"></line>
</svg>
</button>
</div>

<div class="mock-content">
<div class="codex-card">
<div>
<div class="codex-icon">🚇</div>
<div class="codex-title">지옥철 1호칸</div>
<div class="codex-desc">처음 마주하는 객차. 낮은 위험도지만 이상 현상이 잦습니다.</div>
</div>
<div class="codex-state">Unlocked</div>
</div>
<div class="codex-card">
<div>
<div class="codex-icon">🕯️</div>
<div class="codex-title">꺼지지 않는 조명</div>
<div class="codex-desc">관찰할수록 밝기가 달라지는 수상한 객실 조명입니다.</div>
</div>
<div class="codex-state">Observed</div>
</div>
<div class="codex-card">
<div>
<div class="codex-icon">🎫</div>
<div class="codex-title">찢어진 승차권</div>
<div class="codex-desc">목적지가 지워진 채 발견되는 기본 단서 아이템입니다.</div>
</div>
<div class="codex-state">Item</div>
</div>
<div class="codex-card">
<div>
<div class="codex-icon">?</div>
<div class="codex-title">미확인 개체</div>
<div class="codex-desc">아직 충분한 정보가 수집되지 않았습니다.</div>
</div>
<div class="codex-state">Locked</div>
</div>
</div>
</div>
</div>
<!-- popup -->
