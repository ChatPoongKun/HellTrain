<!-- popup -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

.bg-orb {
position: absolute;
border-radius: 50%;
filter: blur(100px);
z-index: 0;
}
.orb-1 {
width: 400px;
height: 400px;
background: rgba(139, 92, 246, 0.2);
top: -100px;
left: -100px;
}
.orb-2 {
width: 300px;
height: 300px;
background: rgba(56, 189, 248, 0.2);
bottom: -50px;
right: -50px;
}

.popup-overlay {
position: fixed;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
z-index: 10;
padding: 1rem;
}

.popup-container {
width: 100%;
max-width: 520px;
background: rgba(30, 41, 59, 0.7);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 24px;
box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
overflow: hidden;
display: flex;
flex-direction: column;
animation: popupIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes popupIn {
0% { opacity: 0; transform: scale(0.95) translateY(20px); }
100% { opacity: 1; transform: scale(1) translateY(0); }
}

.popup-header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 0.1rem 1rem;
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
background: rgba(255, 255, 255, 0.02);
}

.popup-title {
font-size: 1.25rem;
font-weight: 600;
letter-spacing: 0.5px;
display: flex;
align-items: center;
gap: 0.5rem;
color: #fff;
}

.popup-title::before {
content: '';
display: block;
width: 4px;
height: 20px;
background: #38bdf8;
border-radius: 4px;
box-shadow: 0 0 10px #38bdf8;
}

.close-btn {
background: transparent;
border: none;
color: #94a3b8;
cursor: pointer;
width: 36px;
height: 36px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.2s ease;
}

.close-btn:hover {
background: rgba(255, 255, 255, 0.1);
color: white;
transform: rotate(90deg);
}

.settings-content {
padding: 1rem;
display: flex;
flex-direction: column;
gap: 0.75rem;
overflow-y: auto;
max-height: 500px;
scroll-behavior: smooth;
}

.setting-row {
display: flex;
align-items: center;
justify-content: space-between;
gap: 1rem;
padding: 1rem;
min-height: 72px;
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.05);
border-radius: 16px;
transition: all 0.3s ease;
}

.setting-row:hover {
background: rgba(255, 255, 255, 0.08);
border-color: rgba(56, 189, 248, 0.3);
transform: translateY(-2px);
box-shadow: 0 10px 20px -10px rgba(0,0,0,0.4), 0 0 15px rgba(56, 189, 248, 0.1);
}

.setting-info {
min-width: 0;
}

.setting-title {
font-size: 1rem;
font-weight: 600;
color: #fff;
}

.setting-desc {
font-size: 0.82rem;
line-height: 1.4;
color: #94a3b8;
margin-top: 0.2rem;
}

.toggle {
width: 48px;
height: 28px;
border-radius: 999px;
background: rgba(148, 163, 184, 0.25);
border: 1px solid rgba(255, 255, 255, 0.08);
position: relative;
flex-shrink: 0;
}

.toggle::after {
content: '';
position: absolute;
width: 22px;
height: 22px;
left: 2px;
top: 2px;
border-radius: 50%;
background: #fff;
transition: all 0.2s ease;
}

.toggle.on {
background: rgba(139, 92, 246, 0.55);
border-color: rgba(139, 92, 246, 0.5);
}

.toggle.on::after {
left: 22px;
}

.select-pill {
padding: 0.45rem 0.8rem;
border-radius: 999px;
background: rgba(139, 92, 246, 0.2);
border: 1px solid rgba(139, 92, 246, 0.3);
color: #c4b5fd;
font-size: 0.82rem;
font-weight: 600;
white-space: nowrap;
}

@media (max-width: 600px) {
.popup-overlay {
padding: 0;
align-items: flex-end;
}
.popup-container {
max-width: 100%;
height: 100vh;
border-radius: 0;
border: none;
border-top: 1px solid rgba(255, 255, 255, 0.1);
animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.settings-content {
max-height: none;
flex: 1;
}
@keyframes slideUp {
0% { transform: translateY(100%); }
100% { transform: translateY(0); }
}
}
</style>

<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>

<div class="popup-overlay">
<div class="popup-container">
<div class="popup-header">
<div class="popup-title">설정</div>
<button class="close-btn" aria-label="닫기" risu-btn="popupManage|close">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<line x1="18" y1="6" x2="6" y2="18"></line>
<line x1="6" y1="6" x2="18" y2="18"></line>
</svg>
</button>
</div>

<div class="settings-content">
<div class="setting-row">
<div class="setting-info">
<div class="setting-title">자동 진행</div>
<div class="setting-desc">선택지가 하나뿐일 때 다음 단계로 자동 이동합니다.</div>
</div>
<div class="toggle on"></div>
</div>
<div class="setting-row">
<div class="setting-info">
<div class="setting-title">위험 경고</div>
<div class="setting-desc">치명적인 선택지 앞에서 경고 표시를 보여줍니다.</div>
</div>
<div class="toggle on"></div>
</div>
<div class="setting-row">
<div class="setting-info">
<div class="setting-title">텍스트 속도</div>
<div class="setting-desc">대사와 시스템 메시지 표시 속도입니다.</div>
</div>
<div class="select-pill">보통</div>
</div>
<div class="setting-row">
<div class="setting-info">
<div class="setting-title">UI 밀도</div>
<div class="setting-desc">카드와 팝업의 정보 표시 밀도를 조정합니다.</div>
</div>
<div class="select-pill">기본</div>
</div>
</div>
</div>
</div>
<!-- popup -->
