<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>

<div class="popup-overlay popup-shell--settings">
<div class="popup-backdrop" aria-hidden="true" risu-btn="popupManage|close"></div>
<div class="popup-container">
<div class="popup-header">
<div class="popup-title">설정</div>
<button class="close-btn" aria-label="닫기" risu-btn="popupManage|close">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<line x1="18" y1="6" x2="6" y2="18"></line>
<line x1="6" y1="6" x2="18" y2="18"></line>
</svg>
</button>
</div>

<div class="settings-content">
<div class="setting-row">
<div class="setting-info">
<div class="setting-title">자동 진행</div>
<div class="setting-desc">선택지가 하나뿐일 때 다음 단계로 자동 이동합니다.</div>
</div>
<div class="toggle on"></div>
</div>
<div class="setting-row">
<div class="setting-info">
<div class="setting-title">위험 경고</div>
<div class="setting-desc">치명적인 선택지 앞에서 경고 표시를 보여줍니다.</div>
</div>
<div class="toggle on"></div>
</div>
<div class="setting-row">
<div class="setting-info">
<div class="setting-title">텍스트 속도</div>
<div class="setting-desc">대사와 시스템 메시지 표시 속도입니다.</div>
</div>
<div class="select-pill">보통</div>
</div>
<div class="setting-row">
<div class="setting-info">
<div class="setting-title">UI 밀도</div>
<div class="setting-desc">카드와 팝업의 정보 표시 밀도를 조정합니다.</div>
</div>
<div class="select-pill">기본</div>
</div>
</div>
</div>
</div>
